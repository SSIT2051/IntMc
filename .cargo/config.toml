[target.aarch64-linux-android]
linker = "aarch64-linux-android35-clang"
rustflags = [
    "-C", "link-arg=-landroid",
    "-C", "link-arg=-llog",
    "-C", "link-arg=-lEGL",
    "-C", "link-arg=-lGLESv3",
    "-C", "link-arg=-ljnigraphics",
]

[target.armv7-linux-androideabi]
linker = "armv7a-linux-androideabi35-clang"
rustflags = [
    "-C", "link-arg=-landroid",
    "-C", "link-arg=-llog",
    "-C", "link-arg=-lEGL",
    "-C", "link-arg=-lGLESv3",
    "-C", "link-arg=-ljnigraphics",
]

