[package]
name = "intmc"
version = "0.1.0"
edition = "2024"

[lib]
name = "intmc"
path = "src/android_main.rs"
crate-type = ["cdylib"]

[[bin]]
name = "intmc"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = []

[dependencies]
log = "0.4"
env_logger = "0.10"

# UI (egui-based, lightweight)
egui = "0.37"
egui-wgpu = "0.37"
eframe = { version = "0.37", features = ["wgpu", "android-native-activity"], default-features = false }

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Networking for LAN discovery
socket2 = "0.4"

# Storage (SQLite)
rusqlite = { version = "0.31", features = ["bundled"] }

# JSON
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# TOML config
toml = "0.8"

# Process management (server spawning)
thiserror = "1"

# Hash verification
md5 = "0.2"

# UUID generation
uuid = { version = "1", features = ["v4"] }

# Android-specific dependencies
[target.'cfg(target_os = "android")'.dependencies]
# Use a specific version that works with eframe 0.37
android-activity = { version = "0.6.1", features = ["native-activity"] }
ndk = "0.9"
android_logger = "0.15"

[dev-dependencies]
tempfile = "3"

[package.metadata.android]
package-name = "com.example.intmc"
assets = "assets"
permissions = ["INTERNET", "ACCESS_NETWORK_STATE"]
activity = "NativeActivity"

[package.metadata.android.signing.release]
path = "debug.keystore"
keystore_password = "android"
key_password = "android"
alias = "androiddebugkey"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"