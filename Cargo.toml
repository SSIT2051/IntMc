[package]
name = "intmc"
version = "0.1.0"
edition = "2021"

[lib]
name = "intmc"
path = "src/android_main.rs"
crate-type = ["cdylib"]

[[bin]]
name = "intmc"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = []

[dependencies]
log = "0.4"
env_logger = "0.10"

# UI (Slint - lightweight, compiled, native rendering)
slint = "1.5"

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Networking for LAN discovery
socket2 = "0.4"

# HTTP client for plugin downloads (pure Rust, works on Android)
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

# Compression for backup/restore (pure Rust, works on Android)
flate2 = "1"
tar = "0.4"

# Storage (SQLite)
rusqlite = { version = "0.31", features = ["bundled"] }

# JSON
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# TOML config
toml = "0.8"

# Process management (server spawning)
thiserror = "1"

# Synchronization primitives for blocking locks in sync contexts
parking_lot = "0.12"

# Hash verification
md5 = "0.2"

# UUID generation
uuid = { version = "1", features = ["v4"] }

# Date/time formatting
chrono = { version = "0.4", features = ["serde"] }

# OpenSSL for Android cross-compilation (vendored to build from source)
openssl-sys = { version = "0.9", features = ["vendored"] }

# Android-specific dependencies
[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
ndk = "0.9"
android_logger = "0.15"

[build-dependencies]
slint-build = "1.5"

[dev-dependencies]
tempfile = "3"

[package.metadata.android]