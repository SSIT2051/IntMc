[package]
name = "intmc"
version = "0.1.0"
edition = "2024"

[dependencies]
log = "0.4"
env_logger = "0.10"

# UI (egui-based, lightweight)
egui = "0.21"
eframe = "0.21"

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Networking for LAN discovery
socket2 = "0.4"

# Storage (SQLite)
rusqlite = { version = "0.31", features = ["bundled"] }

# JSON
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# TOML config
toml = "0.8"

# Process management (server spawning)
thiserror = "1"

# Hash verification
md5 = "0.2"

# UUID generation
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "android")'.dependencies]
# Android NDK bridge
android-activity = "0.6"
ndk = "0.8"

[dev-dependencies]
tempfile = "3"
